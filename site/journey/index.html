<!DOCTYPE html>
<html lang="en" data-page="journey" data-root="../">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="journey.page.title"></title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="stylesheet" href="../assets/tokens.css">
  <link rel="stylesheet" href="../assets/base.css">
  <link rel="stylesheet" href="../assets/components.css">
  <link rel="stylesheet" href="../assets/board.css">
  <link rel="stylesheet" href="journey.css">
  <script src="../assets/theme.js"></script>
  <script src="../assets/diagram.js" defer></script>
  <script src="../assets/i18n.js" defer></script>
  <script src="../assets/shared.i18n.js" defer></script>
  <script src="../assets/pages.js" defer></script>
  <script src="../assets/layout.js" defer></script>
  <script src="../assets/motion.js" defer></script>
  <script src="../assets/board.i18n.js" defer></script>
  <script src="journey.i18n.js" defer></script>
  <script src="../assets/levels.js" defer></script>
  <script src="../assets/board.data.js" defer></script>
  <script src="../assets/board.player.js" defer></script>
  <script src="../assets/board.js" defer></script>
  <script src="journey.js" defer></script>
  <script src="journey.diagram.js" defer></script>
</head>
<body>
  <header data-site-header></header>

  <main id="main">
    <section class="section" aria-labelledby="journey-title">
      <div class="container">
        <h1 id="journey-title" data-i18n="journey.title"></h1>
        <p class="section__intro measure" data-i18n="journey.lead"></p>
      </div>
    </section>

    <section class="section" aria-labelledby="walk-title">
      <div class="container">
        <h2 id="walk-title" data-i18n="journey.walk.title"></h2>
        <p class="section__intro measure" data-i18n="journey.walk.intro"></p>
        <div data-board></div>
      </div>
    </section>

    <section class="section" aria-labelledby="columns-title">
      <div class="container">
        <h2 id="columns-title" data-i18n="journey.columns.title"></h2>
        <p class="section__intro measure" data-i18n="journey.columns.intro"></p>
        <div class="columns" data-columns></div>
      </div>
    </section>

    <section class="section" aria-labelledby="diagram-title">
      <div class="container">
        <h2 id="diagram-title" data-i18n="journey.diagram.title"></h2>
        <p class="section__intro measure" data-i18n="journey.diagram.text"></p>
        <figure class="diagram" data-diagram>
          <button type="button" class="button button--secondary diagram__toggle" data-diagram-toggle aria-pressed="false">
            <span class="diagram__on" data-i18n="diagram.full"></span>
            <span class="diagram__off" data-i18n="diagram.exit"></span>
          </button>
          <iframe class="diagram__frame" data-diagram-frame data-i18n-attr="title:journey.diagram.title"></iframe>
        </figure>
        <p class="diagram__note muted" data-i18n="journey.diagram.source"></p>
      </div>
    </section>
  </main>

  <footer data-site-footer></footer>
</body>
</html>
